<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Idea - OpenConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 text-slate-900">

    <!-- Navigation -->
    <!-- Injected -->

    <main class="min-h-screen py-8 pb-24 animate-enter">

        <div class="max-w-6xl mx-auto px-4 md:px-8">

            <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 md:p-8">

                <div class="flex items-center gap-3 mb-6">
                    <a href="dashboard.html" class="text-slate-400 hover:text-slate-900">
                        <ion-icon name="arrow-back-outline" class="text-2xl"></ion-icon>
                    </a>
                    <h1 class="text-xl font-bold text-slate-900">Create New Idea</h1>
                </div>

                <form id="create-idea-form" class="grid grid-cols-1 lg:grid-cols-12 gap-8">

                    <!-- Left Column: Media & Meta -->
                    <div class="lg:col-span-4 space-y-6">
                        <!-- Image Upload -->
                        <div class="w-full">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Cover Image</label>
                            <div class="relative w-full aspect-video bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center hover:bg-slate-100 transition-colors cursor-pointer group"
                                onclick="document.getElementById('file-upload').click()">
                                <input type="file" id="file-upload" class="hidden" accept="image/*">

                                <!-- Placeholder -->
                                <div class="text-center p-6 group-hover:scale-105 transition-transform"
                                    id="upload-placeholder">
                                    <ion-icon name="cloud-upload-outline"
                                        class="text-4xl text-green-500 mb-2"></ion-icon>
                                    <p class="text-sm text-slate-500 font-medium">Click to upload</p>
                                    <p class="text-xs text-slate-400">PNG, JPG up to 5MB</p>
                                </div>

                                <!-- Preview -->
                                <img id="image-preview"
                                    class="absolute inset-0 w-full h-full object-cover rounded-xl hidden">

                                <!-- Remove Button -->
                                <button type="button"
                                    class="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full shadow hidden hover:bg-red-600"
                                    id="btn-remove-image">
                                    <ion-icon name="close"></ion-icon>
                                </button>
                            </div>
                        </div>

                        <!-- Category -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Category</label>
                            <div class="relative">
                                <select id="category"
                                    class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all text-slate-700 appearance-none font-medium">
                                    <option value="Tech">Technology</option>
                                    <option value="Art">Art & Design</option>
                                    <option value="Business">Business</option>
                                    <option value="Social">Social Impact</option>
                                    <option value="Edu">Education</option>
                                </select>
                                <ion-icon name="chevron-down-outline"
                                    class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></ion-icon>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Details -->
                    <div class="lg:col-span-8 space-y-6">
                        <!-- Title -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Project Title</label>
                            <input type="text" id="title" required
                                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all font-bold text-lg placeholder-slate-400 text-slate-900"
                                placeholder="e.g. EcoTrack AI">
                        </div>

                        <!-- Description -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Description</label>
                            <textarea id="description" rows="6" required
                                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all text-slate-900 placeholder-slate-400 leading-relaxed"
                                placeholder="Describe your idea in detail..."></textarea>
                        </div>

                        <!-- Tags & AI Check -->
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Required Skills</label>
                            <div class="flex gap-2">
                                <input type="text" id="tags"
                                    class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 transition-all text-slate-900 placeholder-slate-400"
                                    placeholder="e.g. React, Python, Marketing">
                                <button type="button" id="btn-analyze-gap"
                                    class="px-5 py-2 bg-teal-50 text-teal-700 font-bold text-sm rounded-lg hover:bg-teal-100 transition-colors flex items-center gap-2 border border-teal-200 shrink-0 shadow-sm">
                                    <ion-icon name="sparkles"></ion-icon> <span>AI Check</span>
                                </button>
                            </div>
                        </div>

                        <!-- AI Gap Result -->
                        <div id="ai-gap-result" class="hidden bg-teal-50 border border-teal-100 p-5 rounded-xl">
                            <h4
                                class="text-xs font-bold text-teal-800 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <ion-icon name="bulb-outline" class="text-lg"></ion-icon> AI Project Insights
                            </h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <p class="text-[10px] font-bold text-slate-500 uppercase mb-2">Missing Skills?</p>
                                    <ul id="gap-missing" class="list-disc list-inside text-sm text-slate-700 space-y-1">
                                    </ul>
                                </div>
                                <div>
                                    <p class="text-[10px] font-bold text-slate-500 uppercase mb-2">Risk Factors</p>
                                    <ul id="gap-risks" class="list-disc list-inside text-sm text-slate-700 space-y-1">
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="pt-2 flex justify-end">
                            <button type="submit" id="btn-submit"
                                class="px-8 py-4 bg-slate-900 text-white font-bold rounded-xl shadow-lg hover:bg-slate-800 transform hover:-translate-y-1 transition-all flex items-center gap-2">
                                <span>Launch Idea</span>
                                <ion-icon name="rocket-outline" class="text-xl"></ion-icon>
                            </button>
                        </div>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ideas.js"></script>

    <script type="module">
        import { renderNavigation, loadSidebarUser } from './js/components/Navigation.js';
        import { AIService } from './js/ai-service.js';

        renderNavigation();
        loadSidebarUser();

        // Image Preview Logic
        document.getElementById('file-upload').addEventListener('change', function (e) {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.getElementById('image-preview');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(this.files[0]);
            }
        });

        // AI Gap Analysis Logic
        const analyzeBtn = document.getElementById('btn-analyze-gap');
        if (analyzeBtn) {
            analyzeBtn.addEventListener('click', async () => {
                const btn = document.getElementById('btn-analyze-gap');
                const resultBox = document.getElementById('ai-gap-result');
                const skillsVal = document.getElementById('tags').value;
                const descVal = document.getElementById('description').value;

                if (!skillsVal || !descVal) {
                    // Assuming showToast is global from js/utils.js
                    if (window.showToast) window.showToast('Please enter description and skills first', 'warning');
                    else alert('Please enter description and skills first');
                    return;
                }

                // Loading State
                const originalText = btn.innerHTML;
                btn.innerHTML = '<ion-icon name="sync" class="animate-spin"></ion-icon> Analyzing...';
                btn.disabled = true;

                try {
                    console.log('Requesting AI Gap Analysis...');
                    const analysis = await AIService.analyzeGap(skillsVal.split(','), descVal);
                    console.log('AI Gap Analysis:', analysis);

                    // Render Results
                    resultBox.classList.remove('hidden');

                    const missingList = document.getElementById('gap-missing');
                    if (analysis.missingSkills && analysis.missingSkills.length > 0) {
                        missingList.innerHTML = analysis.missingSkills.map(s => `<li>${s}</li>`).join('');
                    } else {
                        missingList.innerHTML = '<li class="text-green-600 italic">No major gaps detected.</li>';
                    }

                    const riskList = document.getElementById('gap-risks');
                    if (analysis.riskAnalysis && analysis.riskAnalysis.length > 0) {
                        riskList.innerHTML = analysis.riskAnalysis.map(r => `<li>${r}</li>`).join('');
                    } else {
                        riskList.innerHTML = '<li class="text-green-600 italic">Low risk profile.</li>';
                    }

                    // Optional toast suggestion
                    if (analysis.suggestedRoles && analysis.suggestedRoles.length > 0) {
                        if (window.showToast) window.showToast(`AI Suggests adding: ${analysis.suggestedRoles.join(', ')}`, 'info');
                    }

                } catch (error) {
                    console.error("AI Gap Check Failed", error);
                    alert('AI Service Failed. Ensure server is running.');
                } finally {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            });
        }
    </script>
</body>

</html>
