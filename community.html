<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - OpenConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Custom Scrollbar for Chat */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
    </style>
</head>

<body class="bg-white text-slate-900 font-sans antialiased overflow-hidden h-screen">
    <!-- Navbar injected via Layout -->

    <!-- Main Container -->
    <div id="community-app" class="flex h-[calc(100vh-64px)] md:h-screen w-full overflow-hidden animate-enter">

        <!-- 1. Channel Sidebar (Left) -->
        <div class="w-64 bg-slate-50 border-r border-slate-200 flex flex-col hidden md:flex" id="channels-sidebar">

            <!-- Community Header -->
            <div
                class="h-16 border-b border-slate-200 flex items-center justify-between px-4 hover:bg-slate-100 transition-colors cursor-pointer">
                <h1 class="font-bold text-slate-900 truncate" id="comm-name">Loading...</h1>
                <ion-icon name="chevron-down" class="text-slate-500"></ion-icon>
            </div>

            <!-- Channels List -->
            <div class="flex-1 overflow-y-auto p-3 space-y-6">
                <!-- Text Channels -->
                <div>
                    <div class="flex items-center justify-between px-2 mb-1 group">
                        <h3
                            class="text-xs font-bold text-slate-400 uppercase tracking-wider group-hover:text-slate-600 transition-colors">
                            Text Channels</h3>
                        <button class="text-slate-400 hover:text-slate-900"><ion-icon name="add"></ion-icon></button>
                    </div>
                    <div class="space-y-0.5">
                        <button onclick="switchChannel('general')" id="channel-general"
                            class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-slate-600 hover:bg-slate-200 hover:text-slate-900 transition-all font-medium text-sm bg-slate-200 text-slate-900">
                            <ion-icon name="hashtag" class="text-slate-400 text-lg"></ion-icon> general
                        </button>
                        <button onclick="switchChannel('announcements')" id="channel-announcements"
                            class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-slate-500 hover:bg-slate-200 hover:text-slate-900 transition-all font-medium text-sm">
                            <ion-icon name="megaphone-outline" class="text-slate-400 text-lg"></ion-icon> announcements
                        </button>
                        <button onclick="switchChannel('projects')" id="channel-projects"
                            class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-slate-500 hover:bg-slate-200 hover:text-slate-900 transition-all font-medium text-sm">
                            <ion-icon name="rocket-outline" class="text-slate-400 text-lg"></ion-icon> projects
                        </button>
                        <button onclick="switchChannel('resources')" id="channel-resources"
                            class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-slate-500 hover:bg-slate-200 hover:text-slate-900 transition-all font-medium text-sm">
                            <ion-icon name="library-outline" class="text-slate-400 text-lg"></ion-icon> resources
                        </button>
                    </div>
                </div>

                <!-- Voice Channels (Visual Only) -->
                <div>
                    <div class="flex items-center justify-between px-2 mb-1 group">
                        <h3
                            class="text-xs font-bold text-slate-400 uppercase tracking-wider group-hover:text-slate-600 transition-colors">
                            Voice Channels</h3>
                        <button class="text-slate-400 hover:text-slate-900"><ion-icon name="add"></ion-icon></button>
                    </div>
                    <div class="space-y-0.5">
                        <button
                            class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-slate-500 hover:bg-slate-200 hover:text-slate-900 transition-all font-medium text-sm">
                            <ion-icon name="volume-medium-outline" class="text-slate-400 text-lg"></ion-icon> Lounge
                        </button>
                        <button
                            class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md text-slate-500 hover:bg-slate-200 hover:text-slate-900 transition-all font-medium text-sm">
                            <ion-icon name="volume-medium-outline" class="text-slate-400 text-lg"></ion-icon> Meeting
                            Room
                        </button>
                    </div>
                </div>
            </div>

            <!-- User Status (Bottom) -->
            <div class="p-3 bg-slate-100 border-t border-slate-200 flex items-center gap-2">
                <div class="relative">
                    <img id="my-avatar" src="https://ui-avatars.com/api/?name=User"
                        class="w-8 h-8 rounded-full bg-white object-cover">
                    <div
                        class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-slate-100">
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-bold text-slate-900 truncate" id="my-name">...</p>
                    <p class="text-[10px] text-slate-500 truncate">Online</p>
                </div>
                <div class="flex gap-1">
                    <button onclick="clearChat()" class="text-slate-500 hover:text-red-500"
                        title="Clear Chat History"><ion-icon name="trash-outline"></ion-icon></button>
                    <button class="text-slate-500 hover:text-slate-900"><ion-icon
                            name="settings-sharp"></ion-icon></button>
                </div>
            </div>
        </div>

        <!-- 2. Chat Area (Center) -->
        <div class="flex-1 flex flex-col bg-white min-w-0 relative">

            <!-- Chat Header -->
            <div
                class="h-16 border-b border-slate-200 flex items-center justify-between px-4 flex-shrink-0 bg-white shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <button class="md:hidden text-slate-500" onclick="toggleChannels()"><ion-icon name="menu"
                            class="text-2xl"></ion-icon></button>
                    <div class="flex items-center gap-2">
                        <ion-icon name="hashtag" class="text-slate-400 text-xl"></ion-icon>
                        <h2 class="font-bold text-slate-900" id="current-channel-name">general</h2>
                    </div>
                    <div class="h-4 w-px bg-slate-300 mx-2 hidden sm:block"></div>
                    <p class="text-xs text-slate-500 truncate hidden sm:block" id="channel-desc">Detailed discussions
                        about general topics.</p>
                </div>
                <div class="flex items-center gap-4 text-slate-400">
                    <button class="hover:text-green-600 transition-colors relative">
                        <ion-icon name="notifications" class="text-xl"></ion-icon>
                    </button>
                    <button class="hover:text-slate-900 transition-colors md:hidden" onclick="toggleMembers()">
                        <ion-icon name="people" class="text-xl"></ion-icon>
                    </button>
                    <div class="relative hidden sm:block">
                        <input type="text" placeholder="Search"
                            class="bg-slate-100 text-slate-700 text-xs rounded px-2 py-1 pl-7 w-32 focus:w-48 transition-all focus:outline-none focus:ring-1 focus:ring-green-500">
                        <ion-icon name="search" class="absolute left-1.5 top-1.5 text-slate-400 text-xs"></ion-icon>
                    </div>
                </div>
            </div>

            <!-- Messages Feed -->
            <div id="messages-feed" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-white">
                <!-- Welcome Message -->
                <div class="mt-10 mb-8 px-4">
                    <div
                        class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-3xl mb-4 text-slate-400">
                        <ion-icon name="hashtag"></ion-icon>
                    </div>
                    <h1 class="text-3xl font-bold text-slate-900 mb-2">Welcome to #<span
                            id="welcome-channel">general</span>!</h1>
                    <p class="text-slate-500">This is the start of the <span class="font-bold">#general</span> channel.
                    </p>
                </div>

                <!-- Messages -->
                <div id="chat-messages" class="space-y-4 pb-4">
                    <!-- Loading... -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 px-6 bg-white border-t border-slate-200">
                <form onsubmit="event.preventDefault(); sendMessage();" class="relative">
                    <div class="absolute left-3 top-3 flex items-center gap-2">
                        <button type="button"
                            class="text-slate-400 hover:text-slate-900 bg-slate-100 rounded-full w-6 h-6 flex items-center justify-center transition-colors"><ion-icon
                                name="add" class="font-bold"></ion-icon></button>
                    </div>
                    <input type="text" id="message-input" autocomplete="off"
                        class="w-full bg-slate-100 text-slate-900 placeholder-slate-500 rounded-lg py-3 pl-12 pr-12 focus:outline-none focus:ring-2 focus:ring-green-500/50 transition-all font-medium"
                        placeholder="Message #general">
                    <div class="absolute right-3 top-3 flex items-center gap-3 text-slate-400">
                        <button type="button" class="hover:text-yellow-500 transition-colors"><ion-icon
                                name="happy-outline" class="text-xl"></ion-icon></button>
                        <button type="button" class="hover:text-green-600 transition-colors"><ion-icon
                                name="gift-outline" class="text-xl"></ion-icon></button>
                    </div>
                </form>
                <p class="mt-1 text-[10px] text-slate-400 text-right" id="typing-indicator"></p>
            </div>
        </div>

        <!-- 3. Members Sidebar (Right) -->
        <div class="w-60 bg-slate-50 border-l border-slate-200 hidden lg:block flex-col overflow-hidden"
            id="members-sidebar">
            <div class="h-16 flex items-center px-4 border-b border-slate-200 bg-slate-50">
                <h3 class="font-bold text-xs text-slate-500 uppercase tracking-widest">Members</h3>
            </div>
            <div class="flex-1 overflow-y-auto p-3 space-y-6" id="members-list">
                <!-- Roles -->
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2 px-2">Online — <span
                            id="online-count">0</span></h3>
                    <div class="space-y-1" id="online-members">
                        <!-- Members injected via JS -->
                        <div class="px-2 py-4 text-center text-xs text-slate-400">Loading members...</div>
                    </div>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2 px-2">Offline — <span
                            id="offline-count">0</span></h3>
                    <div class="space-y-1 opacity-70" id="offline-members">
                        <!-- offline -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

    <script type="module">
        import { Layout } from './js/components/Layout.js';

        // 1. Render App Layout
        new Layout('communities');

        // 2. Discord-Clone Logic
        const urlParams = new URLSearchParams(window.location.search);
        const communityId = urlParams.get('id');

        let currentChannel = 'general';
        let channelMessages = [];
        let communityMembers = []; // Store fetched members

        // Load messages safely
        function loadMessages() {
            try {
                const raw = localStorage.getItem(`msgs_${communityId}_${currentChannel}`);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // Filter duplicates based on ID or rudimentary content check
                    const seen = new Set();
                    channelMessages = parsed.filter(m => {
                        const key = m.id + '-' + m.text;
                        if (seen.has(key)) return false;
                        seen.add(key);
                        return true;
                    });
                } else {
                    channelMessages = [];
                }
            } catch (e) {
                console.error("Error loading messages", e);
                channelMessages = [];
            }
        }

        loadMessages();

        async function initDiscord() {
            if (!communityId) {
                // Determine logic or redirect... for now we assume ID is passed or show error
            }

            // Fetch User
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                document.getElementById('my-avatar').src = user.user_metadata.avatar_url || `https://ui-avatars.com/api/?name=${user.email}`;
                document.getElementById('my-name').textContent = user.user_metadata.full_name || user.email.split('@')[0];
            }

            // Fetch Community Details
            if (communityId) {
                const { data: comm } = await supabase.from('communities').select('*').eq('id', communityId).single();
                if (comm) {
                    document.getElementById('comm-name').textContent = comm.name;
                }
            }

            // Fetch Real Members from Supabase
            await fetchMembers(user ? user.id : null);

            // Render Messages
            renderMessages();

            // Setup Real-time / Mock polling
            setInterval(mockIncomingMessage, 20000); // Increased interval to reduce spam
        }

        async function fetchMembers(currentUserId) {
            // Fetch profiles (simulating community members)
            const { data: profiles, error } = await supabase
                .from('profiles')
                .select('*')
                .limit(30);

            if (profiles) {
                communityMembers = profiles.filter(p => p.id !== currentUserId).map(p => ({
                    ...p,
                    status: Math.random() > 0.7 ? 'online' : 'offline', // Random status for liveliness
                    roleColor: Math.random() > 0.8 ? 'text-green-600' : (Math.random() > 0.8 ? 'text-blue-500' : '')
                }));
                renderMembersList();
            }
        }

        function renderMembersList() {
            const online = communityMembers.filter(m => m.status === 'online');
            const offline = communityMembers.filter(m => m.status === 'offline');

            document.getElementById('online-count').textContent = online.length;
            document.getElementById('offline-count').textContent = offline.length;

            document.getElementById('online-members').innerHTML = online.map(m => `
                <div class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-100 cursor-pointer opacity-100 transition-colors group">
                    <div class="relative">
                        <img src="${m.avatar_url || `https://ui-avatars.com/api/?name=${m.full_name}`}" class="w-8 h-8 rounded-full border border-slate-100 bg-white object-cover">
                        <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-slate-50"></div>
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-slate-700 truncate ${m.roleColor}">${m.full_name}</p>
                        ${m.roleColor ? '<p class="text-[10px] text-slate-400">Moderator</p>' : ''}
                    </div>
                </div>
            `).join('');

            document.getElementById('offline-members').innerHTML = offline.map(m => `
                <div class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-100 cursor-pointer grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition-all">
                    <img src="${m.avatar_url || `https://ui-avatars.com/api/?name=${m.full_name}`}" class="w-8 h-8 rounded-full border border-slate-100 bg-white object-cover">
                    <p class="text-sm font-medium text-slate-600 truncate">${m.full_name}</p>
                </div>
            `).join('');
        }

        // --- Functions ---

        window.switchChannel = (channelId) => {
            // Update UI
            document.querySelectorAll('[id^="channel-"]').forEach(el => {
                el.classList.remove('bg-slate-200', 'text-slate-900');
                el.classList.add('text-slate-500');
            });
            const btn = document.getElementById(`channel-${channelId}`);
            btn.classList.add('bg-slate-200', 'text-slate-900');
            btn.classList.remove('text-slate-500');

            // Update Header
            document.getElementById('current-channel-name').textContent = channelId;
            document.getElementById('welcome-channel').textContent = channelId;
            document.getElementById('message-input').placeholder = `Message #${channelId}`;

            // Switch Data
            currentChannel = channelId;
            loadMessages();

            if (channelMessages.length === 0) {
                if (channelId === 'general') addSystemMessage(`Welcome to the start of the #${channelId} channel.`);
            }
            renderMessages();
        };

        window.clearChat = () => {
            if (confirm('Clear chat history for this channel?')) {
                channelMessages = [];
                saveMessages();
                renderMessages();
            }
        }

        window.sendMessage = () => {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const user = document.getElementById('my-name').textContent;
            const avatar = document.getElementById('my-avatar').src;

            const msg = {
                id: Date.now(),
                user,
                avatar,
                text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            channelMessages.push(msg);
            saveMessages();
            renderMessages();
            input.value = '';

            // Scroll to bottom
            const feed = document.getElementById('messages-feed');
            feed.scrollTop = feed.scrollHeight;
        };

        function addSystemMessage(text) {
            // Check duplication
            if (channelMessages.some(m => m.type === 'system' && m.text === text)) return;

            const msg = { id: Date.now(), type: 'system', text, time: 'Now' };
            channelMessages.push(msg);
            saveMessages();
        }

        function saveMessages() {
            localStorage.setItem(`msgs_${communityId}_${currentChannel}`, JSON.stringify(channelMessages));
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');

            if (channelMessages.length === 0) {
                container.innerHTML = '';
                return;
            }

            let lastUser = null;

            container.innerHTML = channelMessages.map(m => {
                const isContinuation = m.user === lastUser && m.type !== 'system';
                lastUser = m.user;

                if (m.type === 'system') {
                    return `
                    <div class="flex items-center gap-4 py-2 px-2 hover:bg-slate-50/50 rounded pointer-events-none opacity-60">
                         <div class="h-px bg-slate-200 flex-1"></div>
                         <span class="text-xs text-slate-400 font-medium">${m.text}</span>
                         <div class="h-px bg-slate-200 flex-1"></div>
                    </div>`;
                }

                if (isContinuation) {
                    return `
                    <div class="group flex gap-4 py-0.5 px-2 hover:bg-slate-50 -mt-2">
                        <div class="w-10 flex-shrink-0 text-[10px] text-slate-400 opacity-0 group-hover:opacity-100 text-right pt-1 select-none">
                            ${m.time.split(' ')[0]}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-slate-800 leading-relaxed text-[15px]">${formatText(m.text)}</p>
                        </div>
                    </div>`;
                }

                return `
                <div class="group flex gap-4 py-1 px-2 hover:bg-slate-50 mt-2">
                    <div class="w-10 h-10 flex-shrink-0 cursor-pointer hover:drop-shadow-sm active:translate-y-px transition-all">
                        <img src="${m.avatar}" class="w-full h-full rounded-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-baseline gap-2 mb-0.5">
                            <span class="font-bold text-slate-900 hover:underline cursor-pointer text-[15px]">${m.user}</span>
                            <span class="text-[10px] text-slate-400 font-medium">${m.time}</span>
                        </div>
                        <p class="text-slate-800 leading-relaxed text-[15px]">${formatText(m.text)}</p>
                    </div>
                </div>
                `;
            }).join('');

            const feed = document.getElementById('messages-feed');
            // Check if user is scrolled up? For now always scroll down
            feed.scrollTop = feed.scrollHeight;
        }

        function formatText(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return text;
        }

        function mockIncomingMessage() {
            // Generate less frequent messages
            if (Math.random() > 0.6 && communityMembers.length > 0) {
                const randomMember = communityMembers[Math.floor(Math.random() * communityMembers.length)];
                const msgs = [
                    'Anyone available to pair program?',
                    'Just pushed a fix.',
                    'Can we schedule a call?',
                    'This framework is amazing.',
                    'Check out this tool!',
                    'Good morning!'
                ];
                const text = msgs[Math.floor(Math.random() * msgs.length)];

                // Anti-duplicate check (don't send if last message is identical)
                const last = channelMessages[channelMessages.length - 1];
                if (last && last.text === text && last.user === randomMember.full_name) return;

                const msg = {
                    id: Date.now(),
                    user: randomMember.full_name,
                    avatar: randomMember.avatar_url || `https://ui-avatars.com/api/?name=${randomMember.full_name}`,
                    text: text,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now()
                };
                channelMessages.push(msg);
                saveMessages();
                renderMessages();
            }
        }

        window.toggleChannels = () => {
            document.getElementById('channels-sidebar').classList.toggle('hidden');
            document.getElementById('channels-sidebar').classList.toggle('absolute');
            document.getElementById('channels-sidebar').classList.toggle('z-50');
            document.getElementById('channels-sidebar').classList.toggle('h-full');
        }

        window.toggleMembers = () => {
            const sb = document.getElementById('members-sidebar');
            if (sb.classList.contains('hidden')) {
                sb.classList.remove('hidden');
                sb.classList.add('absolute', 'right-0', 'z-50', 'h-full', 'shadow-xl');
            } else {
                sb.classList.add('hidden');
                sb.classList.remove('absolute', 'right-0', 'z-50', 'h-full', 'shadow-xl');
            }
        }

        initDiscord();
    </script>
</body>

</html>
