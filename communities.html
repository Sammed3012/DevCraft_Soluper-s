<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communities - OpenConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .category-scroll::-webkit-scrollbar {
            height: 0px;
        }

        .category-scroll {
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-900 font-sans antialiased">

    <!-- Layout Container (Injected via JS) -->

    <div id="communities-content" class="animate-enter pb-16">

        <!-- Hero Section -->
        <div class="relative bg-indigo-900 text-white rounded-3xl overflow-hidden mb-10 shadow-xl mx-4 md:mx-0">
            <div class="absolute inset-0 bg-gradient-to-r from-indigo-900 via-purple-900/80 to-transparent z-10"></div>
            <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80"
                class="absolute inset-0 w-full h-full object-cover opacity-40">

            <div class="relative z-20 p-8 md:p-12 max-w-2xl">
                <span
                    class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-200 text-xs font-bold uppercase tracking-wider rounded-full mb-4 border border-indigo-500/30 backdrop-blur-sm">Connect
                    & Grow</span>
                <h1 class="text-3xl md:text-5xl font-bold mb-4 leading-tight">Find Your Tribe</h1>
                <p class="text-indigo-200 mb-8 text-sm md:text-lg leading-relaxed">Join vibrant communities of
                    developers, designers, and innovators. Share knowledge, get feedback, and build together.</p>

                <div class="flex flex-wrap gap-4">
                    <button onclick="document.getElementById('create-community-modal').classList.remove('hidden')"
                        class="px-6 py-3.5 bg-white text-indigo-900 rounded-xl font-bold text-sm hover:bg-indigo-50 transition-all shadow-lg transform hover:-translate-y-0.5 flex items-center gap-2">
                        <ion-icon name="add-circle" class="text-xl"></ion-icon> Create Community
                    </button>
                    <button onclick="document.getElementById('explore-section').scrollIntoView({behavior: 'smooth'})"
                        class="px-6 py-3.5 bg-indigo-800/50 text-white border border-indigo-400/30 rounded-xl font-bold text-sm hover:bg-indigo-800/80 transition-colors backdrop-blur-sm">
                        Explore Groups
                    </button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 md:px-0" id="explore-section">

            <!-- Filters & Search Bar -->
            <div class="sticky top-0 z-20 bg-gray-50/95 backdrop-blur-sm py-4 mb-6 border-b border-transparent transition-all"
                id="filter-bar">
                <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                    <!-- Search -->
                    <div class="relative w-full md:w-96 group">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none transition-colors group-focus-within:text-indigo-500 text-slate-400">
                            <ion-icon name="search-outline" class="text-xl"></ion-icon>
                        </div>
                        <input type="text" id="comm-search" placeholder="Search communities..."
                            class="block w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl leading-5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all shadow-sm text-sm">
                    </div>

                    <!-- Categories -->
                    <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto category-scroll pb-1 md:pb-0">
                        <button
                            class="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-bold shadow-md whitespace-nowrap">All
                            Groups</button>
                        <button
                            class="px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-xs font-bold hover:bg-slate-50 whitespace-nowrap">Technical</button>
                        <button
                            class="px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-xs font-bold hover:bg-slate-50 whitespace-nowrap">Design</button>
                        <button
                            class="px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-xs font-bold hover:bg-slate-50 whitespace-nowrap">Career
                            Growth</button>
                        <button
                            class="px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-lg text-xs font-bold hover:bg-slate-50 whitespace-nowrap">Academic</button>
                    </div>
                </div>
            </div>

            <!-- Communities Grid -->
            <div id="communities-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading -->
                <div class="col-span-full py-24 flex flex-col items-center justify-center text-center">
                    <div
                        class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mb-4 text-indigo-500 text-3xl animate-bounce">
                        <ion-icon name="people"></ion-icon>
                    </div>
                    <p class="text-slate-500 font-medium">Discovering communities...</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Create Community Modal -->
    <div id="create-community-modal" class="fixed inset-0 z-[100] hidden" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
            onclick="document.getElementById('create-community-modal').classList.add('hidden')"></div>

        <div class="flex items-center justify-center min-h-screen p-4 text-center sm:p-0">
            <div
                class="relative bg-white rounded-2xl shadow-2xl text-left overflow-hidden transform transition-all sm:my-8 sm:max-w-lg w-full border border-slate-100">

                <!-- Modal Header -->
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <ion-icon name="add-circle" class="text-indigo-600 text-xl"></ion-icon> Create New Community
                    </h3>
                    <button
                        class="text-slate-400 hover:text-slate-600 transition-colors p-1 rounded-full hover:bg-slate-200"
                        onclick="document.getElementById('create-community-modal').classList.add('hidden')">
                        <ion-icon name="close" class="text-xl"></ion-icon>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="px-6 py-6">
                    <form id="create-community-form" class="space-y-5">
                        <div>
                            <label
                                class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Community
                                Name</label>
                            <input type="text" id="comm-name" required placeholder="e.g. React Developers, UI/UX Hub"
                                class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all font-semibold placeholder-slate-400 shadow-sm">
                        </div>

                        <div>
                            <label
                                class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Description</label>
                            <textarea id="comm-desc" required rows="3"
                                class="w-full bg-white border border-slate-300 rounded-xl px-4 py-3 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder-slate-400 shadow-sm resize-none"
                                placeholder="What is the purpose of this group?"></textarea>
                        </div>

                        <!-- Auto-add logic hint -->
                        <div class="bg-indigo-50 rounded-lg p-3 flex gap-3 items-start">
                            <ion-icon name="information-circle"
                                class="text-indigo-500 text-lg flex-shrink-0 mt-0.5"></ion-icon>
                            <p class="text-xs text-indigo-700 leading-relaxed">You will automatically become the
                                <strong>Admin</strong> of this community upon creation.</p>
                        </div>

                        <div class="pt-4 flex justify-end gap-3">
                            <button type="button"
                                onclick="document.getElementById('create-community-modal').classList.add('hidden')"
                                class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold text-sm transition-colors">Cancel</button>
                            <button type="submit" id="btn-create-comm"
                                class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition-all shadow-md hover:shadow-lg active:scale-95 flex items-center gap-2">
                                <span>Create Community</span>
                                <ion-icon name="arrow-forward"></ion-icon>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/communities.js"></script>

    <script type="module">
        import { Layout } from './js/components/Layout.js';

        // 1. Render Layout
        new Layout('communities');

        // 2. Initialize Page Logic
        if (window.initCommunities) window.initCommunities();

        // Sticky Header Logic
        window.addEventListener('scroll', () => {
            const bar = document.getElementById('filter-bar');
            if (window.scrollY > 300) { // After hero
                bar.classList.add('shadow-md', 'bg-white/95');
                bar.classList.remove('bg-gray-50/95');
            } else {
                bar.classList.remove('shadow-md', 'bg-white/95');
                bar.classList.add('bg-gray-50/95');
            }
        });
    </script>
</body>

</html>
