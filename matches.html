<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Matches - OpenConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .match-ring {
            transition: stroke-dashoffset 1s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>

<body class="bg-gray-50 text-slate-900 font-sans antialiased">
    <!-- Navbar injected via Layout -->
    <!-- Content Injected via Layout -->

    <div class="max-w-7xl mx-auto px-4 py-8 space-y-8 animate-enter pb-24" id="matches-content">

        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-end gap-6 border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight mb-2">Your Perfect Matches</h1>
                <p class="text-slate-500 max-w-xl">Curated opportunities based on your skill profile <span
                        class="font-mono text-xs bg-slate-100 px-1 py-0.5 rounded text-slate-600"
                        id="user-skills-preview">React, Node.js...</span></p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-48">
                    <ion-icon name="filter-outline"
                        class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></ion-icon>
                    <select
                        class="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:ring-2 focus:ring-green-500 cursor-pointer hover:bg-slate-50 transition-colors">
                        <option>Best Match %</option>
                        <option>Newest</option>
                        <option>Remote Only</option>
                    </select>
                </div>
                <button
                    class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-bold shadow-md hover:bg-slate-800 transition-colors flex items-center gap-2"
                    onclick="window.location.href='profile.html'">
                    <ion-icon name="create-outline"></ion-icon> Edit Profile
                </button>
            </div>
        </div>

        <!-- AI Insight Banner -->
        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-1 shadow-lg">
            <div
                class="bg-white rounded-xl p-4 md:p-6 flex flex-col md:flex-row items-center gap-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-8 opacity-5 pointer-events-none">
                    <ion-icon name="sparkles" class="text-9xl"></ion-icon>
                </div>

                <div
                    class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl flex-shrink-0 animate-bounce-slow">
                    <ion-icon name="bulb"></ion-icon>
                </div>
                <div class="flex-1 text-center md:text-left z-10">
                    <h3 class="font-bold text-slate-900 mb-1">AI Recommendation</h3>
                    <p class="text-sm text-slate-500">Based on your recent activity, adding <span
                            class="font-bold text-emerald-600">TypeScript</span> to your profile could increase your
                        match rate by <span class="font-bold">15%</span>.</p>
                </div>
                <button
                    class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-50 transition-colors z-10">
                    Update Skills
                </button>
            </div>
        </div>

        <!-- Matches Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="matches-grid">
            <!-- Loading State -->
            <div
                class="col-span-full py-24 flex flex-col items-center justify-center text-slate-400 bg-white rounded-3xl border border-dashed border-slate-200">
                <ion-icon name="planet-outline" class="text-5xl mb-4 animate-spin-slow text-slate-300"></ion-icon>
                <p class="font-medium text-slate-500">Analyzing compatibility matrix...</p>
                <p class="text-xs text-slate-400 mt-2">Scanning 1,240+ projects</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

    <script type="module">
        import { Layout } from './js/components/Layout.js';

        // Init Layout
        new Layout('matches');

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'auth.html'; return; }

            // Fetch User Skills (Mock or Real)
            const { data: profile } = await supabase.from('profiles').select('skills').eq('id', session.user.id).single();
            if (profile && profile.skills) {
                document.getElementById('user-skills-preview').textContent = profile.skills.slice(0, 3).join(', ') + (profile.skills.length > 3 ? '...' : '');
            }

            loadMatches();
        });

        async function loadMatches() {
            const container = document.getElementById('matches-grid');

            // Simulate delay for "AI Analysis" feel
            await new Promise(r => setTimeout(r, 1200));

            const { data: ideas, error } = await supabase
                .from('ideas')
                .select('*, profiles(full_name, avatar_url, role)')
                .order('created_at', { ascending: false })
                .limit(9);

            if (ideas && ideas.length > 0) {
                container.innerHTML = ideas.map((idea, index) => {
                    // Simulate Match Score with variety
                    let score = Math.floor(98 - (index * 4) + (Math.random() * 5));
                    if (score < 60) score = 60 + Math.floor(Math.random() * 10);

                    // Determine Tier
                    let color = 'emerald';
                    let label = 'Perfect Match';
                    if (score < 90) { color = 'teal'; label = 'Strong Match'; }
                    if (score < 75) { color = 'amber'; label = 'Good Match'; }

                    // Ring Dash Array
                    const radius = 18;
                    const circumference = 2 * Math.PI * radius;
                    const offset = circumference - (score / 100) * circumference;

                    return `
                     <a href="idea-details.html?id=${idea.id}&from=matches" class="block bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group relative flex flex-col h-full cursor-pointer decoration-0">
                        
                        <!-- Header -->
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <!-- Percentage Ring -->
                                <div class="relative w-12 h-12 flex items-center justify-center">
                                    <svg class="w-full h-full transform -rotate-90">
                                        <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="3" fill="transparent" class="text-slate-100" />
                                        <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="3" fill="transparent" 
                                            class="text-${color}-500 match-ring" 
                                            stroke-dasharray="${circumference}" 
                                            stroke-dashoffset="${offset}" 
                                            stroke-linecap="round" />
                                    </svg>
                                    <span class="absolute text-[10px] font-bold text-slate-700">${score}%</span>
                                </div>
                                <div>
                                    <span class="text-[10px] font-bold uppercase tracking-wider text-${color}-600 bg-${color}-50 px-2 py-0.5 rounded-md border border-${color}-100">
                                        ${label}
                                    </span>
                                </div>
                            </div>
                            <!-- Prevent default on button to not trigger link -->
                            <div class="text-slate-300 hover:text-slate-900 transition-colors p-1 relative z-10" onclick="event.preventDefault(); event.stopPropagation();">
                                <ion-icon name="bookmark-outline" class="text-2xl"></ion-icon>
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="mb-4">
                            <h3 class="text-lg font-bold text-slate-900 mb-2 leading-snug group-hover:text-green-600 transition-colors line-clamp-1">${idea.title}</h3>
                            <p class="text-sm text-slate-500 line-clamp-3 leading-relaxed">${idea.description}</p>
                        </div>
                        
                        <!-- Skills -->
                        <div class="flex flex-wrap gap-2 mb-6 mt-auto">
                            ${(idea.tags || ['General']).slice(0, 3).map(tag =>
                        `<span class="px-2.5 py-1 bg-slate-50 border border-slate-100 rounded-lg text-xs text-slate-600 font-bold">#${tag}</span>`
                    ).join('')}
                        </div>

                        <!-- Footer -->
                        <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                            <div class="flex items-center gap-2">
                                <img src="${idea.profiles?.avatar_url || 'https://ui-avatars.com/api/?name=User'}" class="w-8 h-8 rounded-full border border-slate-100 object-cover">
                                <div class="leading-tight">
                                <p class="text-xs font-bold text-slate-900 hover:underline">${idea.profiles?.full_name || 'Anonymous'}</p>
                                <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">${idea.profiles?.role || 'Founder'}</p>
                                </div>
                            </div>
                            <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-slate-900 group-hover:text-white transition-colors shadow-sm">
                                <ion-icon name="arrow-forward"></ion-icon>
                            </div>
                        </div>
                     </a>`;
                }).join('');
            } else {
                container.innerHTML = `
                <div class="col-span-full text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200">
                    <ion-icon name="search" class="text-4xl text-slate-200 mb-4"></ion-icon>
                    <p class="text-slate-500 font-medium">No matches found at the moment.</p>
                    <button class="mt-4 px-4 py-2 text-sm text-green-600 font-bold hover:bg-green-50 rounded-lg transition-colors">Adjust Filters</button>
                </div>`;
            }
        }
    </script>
</body>

</html>
