<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenConnect - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gray-50 relative overflow-hidden">

    <!-- Minimal decoration -->
    <div
        class="absolute top-0 right-0 w-64 h-64 bg-blue-100 rounded-full blur-3xl opacity-50 -translate-y-1/2 translate-x-1/2">
    </div>
    <div
        class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-100 rounded-full blur-3xl opacity-50 translate-y-1/2 -translate-x-1/2">
    </div>

    <div
        class="w-full max-w-md p-8 bg-white border border-slate-200 rounded-2xl shadow-xl relative z-10 animate-fade-in mx-4">

        <div class="text-center mb-8">
            <div
                class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                <ion-icon name="bulb" class="text-white text-2xl"></ion-icon>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in to continue to OpenConnect</p>
        </div>

        <!-- Auth Tabs -->
        <div class="flex mb-6 bg-slate-100 p-1 rounded-lg">
            <button id="tab-login"
                class="flex-1 py-2 text-sm font-semibold rounded-md transition-all bg-white text-slate-900 shadow-sm"
                onclick="switchTab('login')">Login</button>
            <button id="tab-signup"
                class="flex-1 py-2 text-sm font-semibold rounded-md transition-all text-slate-500 hover:text-slate-900"
                onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <ion-icon name="mail-outline"></ion-icon>
                    </span>
                    <input type="email" id="login-email" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 transition-all text-sm"
                        placeholder="name@example.com">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </span>
                    <input type="password" id="login-password" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 transition-all text-sm"
                        placeholder="••••••••">
                </div>
            </div>
            <button type="submit" id="btn-login"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transform transition active:scale-95 text-sm">
                Sign In
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Full Name</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <ion-icon name="person-outline"></ion-icon>
                    </span>
                    <input type="text" id="signup-name" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 transition-all text-sm"
                        placeholder="John Doe">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <ion-icon name="mail-outline"></ion-icon>
                    </span>
                    <input type="email" id="signup-email" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 transition-all text-sm"
                        placeholder="name@example.com">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </span>
                    <input type="password" id="signup-password" required minlength="6"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 placeholder-slate-400 transition-all text-sm"
                        placeholder="••••••••">
                </div>
            </div>
            <button type="submit" id="btn-signup"
                class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transform transition active:scale-95 text-sm">
                Create Account
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-slate-500">
            <p id="footer-text">New here? <a href="#" onclick="switchTab('signup')"
                    class="text-blue-600 font-bold hover:underline">Create an account</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Tab Switching Logic
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const footerText = document.getElementById('footer-text');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');

                tabLogin.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
                tabLogin.classList.remove('text-slate-500');

                tabSignup.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
                tabSignup.classList.add('text-slate-500');

                footerText.innerHTML = 'New here? <a href="#" onclick="switchTab(\'signup\')" class="text-blue-600 font-bold hover:underline">Create an account</a>';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');

                tabSignup.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
                tabSignup.classList.remove('text-slate-500');

                tabLogin.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
                tabLogin.classList.add('text-slate-500');

                footerText.innerHTML = 'Already have an account? <a href="#" onclick="switchTab(\'login\')" class="text-blue-600 font-bold hover:underline">Sign in</a>';
            }
        }
    </script>
</body>

</html>
