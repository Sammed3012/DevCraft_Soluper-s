<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Details - OpenConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 text-slate-900 font-sans antialiased">

    <!-- Layout Container (Injected via JS) -->

    <!-- Main Content -->
    <div id="idea-details-content" class="max-w-7xl mx-auto px-4 py-8 animate-enter">
        <button onclick="window.history.back()"
            class="mb-4 flex items-center gap-2 text-slate-500 hover:text-slate-900 transition-colors">
            <ion-icon name="arrow-back-outline"></ion-icon> Back
        </button>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left: Content (Post Style) -->
            <div class="lg:col-span-2 space-y-6">

                <!-- Main Post Card -->
                <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden"
                    id="idea-card-container">

                    <!-- Header -->
                    <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <img id="post-avatar" src=""
                                class="w-12 h-12 rounded-full border border-slate-200 object-cover">
                            <div>
                                <h3 class="font-bold text-base text-slate-900" id="post-author">Loading...</h3>
                                <p class="text-xs text-slate-500 flex items-center gap-1">
                                    <ion-icon name="time-outline"></ion-icon> <span id="post-date">Just now</span>
                                </p>
                            </div>
                        </div>
                        <button
                            class="text-slate-400 hover:text-slate-900 p-2 hover:bg-slate-100 rounded-full transition-colors">
                            <ion-icon name="ellipsis-horizontal" class="text-xl"></ion-icon>
                        </button>
                    </div>

                    <!-- Image / Content -->
                    <div class="w-full bg-slate-50 min-h-[300px] flex items-center justify-center relative group overflow-hidden"
                        id="post-image-container">
                        <!-- Image or default placeholder -->
                        <img id="post-image"
                            class="w-full object-cover max-h-[600px] hidden transition-opacity duration-500">
                        <div id="post-placeholder" class="text-center p-10">
                            <ion-icon name="image-outline" class="text-6xl text-slate-300 mb-4"></ion-icon>
                            <p class="text-slate-400 text-sm">No project image provided.</p>
                        </div>
                    </div>

                    <!-- Likes & Description -->
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h1 class="text-2xl font-bold text-slate-900 mb-2 leading-tight" id="post-title">Project
                                    Title</h1>
                                <div class="flex items-center gap-4 text-sm text-slate-500">
                                    <span
                                        class="flex items-center gap-1 hover:text-red-500 transition-colors cursor-pointer"><ion-icon
                                            name="heart" class="text-red-500"></ion-icon> <span id="like-count">0</span>
                                        likes</span>
                                    <span class="flex items-center gap-1"><ion-icon
                                            name="chatbubble-outline"></ion-icon> 0 comments</span>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button id="btn-like"
                                    class="p-2 rounded-full bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 transition-colors">
                                    <ion-icon name="heart-outline" class="text-xl"></ion-icon>
                                </button>
                                <button
                                    class="p-2 rounded-full bg-slate-50 hover:bg-green-50 text-slate-400 hover:text-green-600 transition-colors">
                                    <ion-icon name="share-social-outline" class="text-xl"></ion-icon>
                                </button>
                            </div>
                        </div>

                        <div class="prose prose-sm max-w-none text-slate-700 mb-6 border-b border-slate-100 pb-6">
                            <p class="whitespace-pre-wrap text-base leading-relaxed" id="post-desc">Loading
                                description...</p>
                        </div>

                        <!-- Skills / Tags -->
                        <div>
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Technologies &
                                Skills</h4>
                            <div class="flex flex-wrap gap-2" id="post-skills">
                                <!-- Injected -->
                            </div>
                        </div>
                    </div>

                    <!-- Add Comment Section -->
                    <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center gap-3">
                        <img id="current-user-avatar" src="https://ui-avatars.com/api/?name=Me"
                            class="w-8 h-8 rounded-full border border-slate-200">
                        <div class="flex-1 relative">
                            <input type="text" id="comment-input" placeholder="Add a comment..."
                                class="w-full bg-white border border-slate-200 rounded-full py-2 pl-4 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all">
                            <button id="btn-post-comment"
                                class="absolute right-2 top-1/2 -translate-y-1/2 text-green-600 font-bold text-xs hover:bg-green-50 px-2 py-1 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Post</button>
                        </div>
                    </div>

                </div>

                <!-- Comments Feed -->
                <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 hidden" id="comments-section">
                    <h3 class="font-bold text-sm text-slate-900 mb-4">Comments</h3>
                    <div id="comments-list" class="space-y-6">
                        <!-- Comments -->
                    </div>
                </div>

            </div>

            <!-- Right: Sidebar (Matches & Context) -->
            <div class="space-y-6">

                <!-- Author Profile Card -->
                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Project Owner</h3>
                    <div class="flex items-center gap-4 mb-4">
                        <img id="sidebar-author-avatar"
                            class="w-14 h-14 rounded-full border-2 border-slate-100 object-cover">
                        <div>
                            <p class="font-bold text-base text-slate-900" id="sidebar-author-name">Name</p>
                            <p class="text-xs text-slate-500">Founder & Lead</p>
                        </div>
                    </div>
                    <button
                        class="w-full py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-50 transition-colors flex items-center justify-center gap-2">
                        <ion-icon name="person"></ion-icon> View Profile
                    </button>
                </div>

                <!-- AI COMPATIBILITY CARD (New) -->
                <div
                    class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:scale-110 transition-transform">
                        <ion-icon name="sparkles" class="text-8xl text-white"></ion-icon>
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-4">
                            <div
                                class="w-8 h-8 rounded-lg bg-green-500/20 flex items-center justify-center text-green-400 border border-green-500/30">
                                <ion-icon name="analytics"></ion-icon>
                            </div>
                            <h3 class="font-bold text-sm">AI Compatibility</h3>
                        </div>

                        <div class="flex items-end gap-1 mb-2">
                            <span class="text-4xl font-bold tracking-tight" id="ai-match-percent">--</span>
                            <span class="text-lg font-medium text-slate-400 mb-1">% Match</span>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed mb-4" id="ai-match-reason">Analyzing your
                            profile fit...</p>

                        <div class="space-y-2">
                            <button id="btn-collaborate"
                                class="w-full py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl text-sm font-bold transition-transform active:scale-95 shadow-lg shadow-green-900/20 flex items-center justify-center gap-2">
                                <ion-icon name="hand-right"></ion-icon> Request to Join
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Similiar Projects -->
                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Similar Projects</h3>
                    <div id="matches-container" class="space-y-4">
                        <p class="text-xs text-slate-400 py-4 text-center">Finding similar projects...</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

    <script type="module">
        import { Layout } from './js/components/Layout.js';

        // Initialize Layout dynamically based on referrer
        // This ensures the sidebar highlights the correct "parent" section
        let sourcePage = 'dashboard';
        if (document.referrer.includes('ideas.html')) sourcePage = 'ideas'; // maps to 'Explore Ideas'
        else if (document.referrer.includes('matches.html')) sourcePage = 'matches'; // maps to 'Find Matches'
        else if (document.referrer.includes('profile.html')) sourcePage = 'profile';

        new Layout(sourcePage);

        // Logic
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ideaId = urlParams.get('id');

            if (ideaId) {
                await loadIdeaDetails(ideaId);
            } else {
                window.location.href = 'ideas.html';
            }
        });

        async function loadIdeaDetails(id) {
            const { data: idea, error } = await supabase
                .from('ideas')
                .select('*, profiles(*)')
                .eq('id', id)
                .single();

            if (error || !idea) {
                document.getElementById('post-title').innerText = "Project Not Found";
                return;
            }

            // Render Main Content
            document.getElementById('post-title').innerText = idea.title;
            document.getElementById('post-desc').innerText = idea.description;
            document.getElementById('like-count').innerText = idea.upvotes_count || 0;

            const dateEl = document.getElementById('post-date');
            if (dateEl) dateEl.innerText = new Date(idea.created_at).toLocaleDateString();

            // Render Author
            if (idea.profiles) {
                const name = idea.profiles.full_name || 'Anonymous';
                const avatar = idea.profiles.avatar_url || `https://ui-avatars.com/api/?name=${name}`;

                const a1 = document.getElementById('post-author'); if (a1) a1.innerText = name;
                const i1 = document.getElementById('post-avatar'); if (i1) i1.src = avatar;
                const a2 = document.getElementById('sidebar-author-name'); if (a2) a2.innerText = name;
                const i2 = document.getElementById('sidebar-author-avatar'); if (i2) i2.src = avatar;
            }

            // Render Image
            if (idea.image_url) {
                const img = document.getElementById('post-image');
                img.src = idea.image_url;
                img.classList.remove('hidden');
                document.getElementById('post-placeholder').classList.add('hidden');
            }

            // Render Skills
            if (idea.tags && idea.tags.length > 0) {
                document.getElementById('post-skills').innerHTML = idea.tags.map(tag =>
                    `<span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-medium border border-slate-200">#${tag}</span>`
                ).join('');
            } else {
                document.getElementById('post-skills').innerHTML = '<span class="text-xs text-slate-400 italic">No specific skills tagged.</span>';
            }

            // AI Match Simulation
            simulateAIMatch();
        }

        function simulateAIMatch() {
            setTimeout(() => {
                const score = Math.floor(Math.random() * (98 - 70) + 70);
                const el = document.getElementById('ai-match-percent');
                if (el) {
                    animateValue(el, 0, score, 2000);
                    document.getElementById('ai-match-reason').innerText = `Great fit! Your skills align well with this project's stack.`;
                }
            }, 500);
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

    </script>
</body>

</html>
